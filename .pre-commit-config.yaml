default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit, pre-push]

# Hooks receive explicit filenames; keep vendored code and submodules out.
exclude: ^(bk_client/|bk_maya/(lib|bk_proxor)/|out/|_debug/|_bck/|\.venv/)

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/jsh9/pydoclint
    rev: 0.9.1
    hooks:
      - id: pydoclint

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "_bandit.yaml", "-ll"]
        exclude: ^tests/

  # The Go client now lives in the bk_client submodule and is formatted/linted
  # in its own repository's CI, so there is no in-tree gofmt hook here.
